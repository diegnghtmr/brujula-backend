[versions]
java = "25"
springBoot = "4.0.3"
springDependencyManagement = "1.1.7"
springModulith = "2.0.2"
springdocOpenapi = "3.0.3"
openapiGenerator = "7.14.0"
spotless = "7.0.4"
googleJavaFormat = "1.27.0"
archunit = "1.4.1"
testcontainers = "1.21.0"
dockerJava = "3.5.0"
jacoco = "0.8.13"

[libraries]
# Spring Boot starters (versions managed by BOM)
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }
spring-session-jdbc = { module = "org.springframework:spring-jdbc" }

# Spring Modulith
spring-modulith-starter-core = { module = "org.springframework.modulith:spring-modulith-starter-core" }
spring-modulith-starter-test = { module = "org.springframework.modulith:spring-modulith-starter-test" }

# springdoc
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdocOpenapi" }

# Flyway (version managed by Boot BOM)
# spring-boot-flyway is a Spring Boot 4 module that provides FlywayAutoConfiguration
# (Boot 4 moved all tech-specific autoconfiguration to dedicated modules)
spring-boot-flyway = { module = "org.springframework.boot:spring-boot-flyway" }
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }

# PostgreSQL driver (version managed by Boot BOM)
postgresql = { module = "org.postgresql:postgresql" }

# ArchUnit
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

# Testcontainers (version managed by Boot BOM)
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql" }
# Force newer docker-java to fix Docker 29.x API version incompatibility (3.4.2 sends v1.32, Docker 29.x requires >=1.40)
docker-java-api = { module = "com.github.docker-java:docker-java-api", version.ref = "dockerJava" }
docker-java-transport-zerodep = { module = "com.github.docker-java:docker-java-transport-zerodep", version.ref = "dockerJava" }

# OpenAPI generated code dependencies
swagger-annotations = { module = "io.swagger.core.v3:swagger-annotations", version = "2.2.30" }
jakarta-annotation-api = { module = "jakarta.annotation:jakarta.annotation-api", version = "3.0.0" }
jackson-databind-nullable = { module = "org.openapitools:jackson-databind-nullable", version = "0.2.6" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
openapi-generator = { id = "org.openapi.generator", version.ref = "openapiGenerator" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
