# The testcontainers 1.21.0 shaded docker-java reads this file to configure DefaultDockerClientConfig.
# Constant pool analysis of DefaultDockerClientConfig.class confirmed "docker-java.properties"
# as the resource file name and "api.version" as the property key.
api.version=1.45
