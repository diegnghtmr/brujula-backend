spring:
  application:
    name: brujula-backend
  # Multipart upload limits (IMP-001, NFR-002, NFR-004).
  # max-file-size matches the imports.maxFileSizeBytes default (5 MB).
  # max-request-size adds 1 MB headroom for multipart form-field overhead.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  session:
    store-type: jdbc
    jdbc:
      # G1 RESOLVED: Spring Session 4 qualified table-name for schema-prefixed tables.
      # The property key is spring.session.jdbc.table-name; value uses schema.TABLE_NAME format.
      # initialize-schema=never because Flyway owns the DDL (V006, DB-002/003, ADR-F1-004).
      table-name: "platform.SPRING_SESSION"
      initialize-schema: never
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: brujula-backend
            # Client secret is overridden per environment (local: .env, prod: secret manager).
            # Placeholder here — real secret must not be committed.
            client-secret: CHANGE_ME
            authorization-grant-type: authorization_code
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          keycloak:
            # Static URIs avoid OIDC discovery at startup (issuer-uri triggers an HTTP call).
            # These values are defaults for local Keycloak on port 9090; override per environment.
            authorization-uri: http://localhost:9090/realms/brujula-dev/protocol/openid-connect/auth
            token-uri: http://localhost:9090/realms/brujula-dev/protocol/openid-connect/token
            jwk-set-uri: http://localhost:9090/realms/brujula-dev/protocol/openid-connect/certs
            user-info-uri: http://localhost:9090/realms/brujula-dev/protocol/openid-connect/userinfo
            user-name-attribute: sub
    user:
      name: actuator
      password: actuator

# springdoc disabled by default (enabled only on local profile)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

# Brújula Keycloak Admin API configuration (S2-A slice-2 additions)
# These properties configure the KeycloakAdminApiAdapter used for app-driven student registration.
# All secrets MUST be provided via environment variables — never committed as real values.
# G4 RESOLVED: service-account client brujula-registration-svc added to realm-export.json (Slice 2).
brujula:
  registration:
    # G6 RESOLVED: Consent terms/version source = configuration properties (Slice 2, S2-B-0).
    # Version bumps require only a config change and restart (no code release).
    # The client sends acceptedTerms/acceptedDataProcessing booleans; the backend records the
    # CONFIGURED current version as evidence — versions are not client-supplied per this contract.
    current-terms-version: "1.0"
    current-privacy-version: "1.0"
    # SPA landing URI for Keycloak's email verification redirect (obs #1574).
    # Must be registered as a valid redirect URI for the SPA client in the realm.
    verify-redirect-uri: "http://localhost:5173/verify-email"
    # SPA landing URI for Keycloak's password recovery redirect (OPTION A, S2-D).
    # Keycloak redirects the user here after they complete the password reset on Keycloak's page.
    recovery-redirect-uri: "http://localhost:5173/reset-password"
  keycloak:
    # Keycloak server base URL (overridden per environment via env vars or profile yaml).
    auth-server-url: http://localhost:9090
    # Realm for Admin API calls (brujula-dev in local/dev; override per environment).
    realm: brujula-dev
    # Derived Admin REST API base URL: {auth-server-url}/admin/realms/{realm}
    admin-base-url: "${brujula.keycloak.auth-server-url}/admin/realms/${brujula.keycloak.realm}"
    # Token endpoint for client-credentials grant (obs #1574: realm-scoped, not master).
    token-url: "${brujula.keycloak.auth-server-url}/realms/${brujula.keycloak.realm}/protocol/openid-connect/token"
    registration-svc:
      # Service-account client for Keycloak Admin API (manage-users role in realm-management).
      # Secret must be provided via BRUJULA_KEYCLOAK_REGISTRATION_SVC_CLIENT_SECRET env var.
      client-id: brujula-registration-svc
      client-secret: "${BRUJULA_KEYCLOAK_REGISTRATION_SVC_CLIENT_SECRET:CHANGE_ME_REGISTRATION_SVC}"
