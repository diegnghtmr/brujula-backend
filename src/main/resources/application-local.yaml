# Local profile — enables springdoc/Swagger UI and dev-friendly settings.
# Activate with: SPRING_PROFILES_ACTIVE=local (or -Dspring.profiles.active=local)
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/planner_db
    username: brujula
    # F-006 RESOLVED: password aligned with compose.yaml default (POSTGRES_PASSWORD=brujula_dev).
    # Override via SPRING_DATASOURCE_PASSWORD env var for environments with different passwords.
    password: brujula_dev
  jpa:
    show-sql: false
  security:
    oauth2:
      client:
        registration:
          keycloak:
            # Local Keycloak client secret — override via SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_SECRET env var.
            client-secret: "${KEYCLOAK_CLIENT_SECRET:CHANGE_ME}"
        # provider.keycloak uses static URIs from application.yaml (no issuer-uri discovery)
        # to avoid requiring Keycloak to be running on application startup in local dev.
        # Start Keycloak with: docker compose -f ops/local/compose.yaml up keycloak

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui/index.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
