# ============================================================
# Brújula — Local Dependencies Compose (DC-001, TRD §16)
# "Dependencias" mode: postgres + keycloak + mailpit only.
# No `latest` tags. All images pinned to specific versions.
#
# Usage:
#   docker compose -f ops/local/compose.yaml up -d
#   docker compose -f ops/local/compose.yaml down -v    # destroy volumes
# ============================================================

name: brujula-local

volumes:
  pgdata:
    driver: local

networks:
  brujula-net:
    driver: bridge

services:

  # ------------------------------------------------------------
  # PostgreSQL 18.4
  # Hosts: planner_db (application) + keycloak_db (Keycloak IAM)
  # ------------------------------------------------------------
  postgres:
    image: postgres:18.4
    container_name: brujula-postgres
    restart: unless-stopped
    networks:
      - brujula-net
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brujula}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brujula_dev}
      POSTGRES_DB: ${POSTGRES_DB:-planner_db}
      # postgres 18 stores data in a versioned subdirectory by default.
      # Explicitly set PGDATA to avoid "data already exists at parent mount" error.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brujula} -d ${POSTGRES_DB:-planner_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ------------------------------------------------------------
  # Keycloak 26.4.x — OIDC identity provider
  # Placeholder realm imported from ops/local/keycloak/realm-export.json
  # Real realm configuration: PEN-005 (Fase 1)
  # ------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.5
    container_name: brujula-keycloak
    restart: unless-stopped
    networks:
      - brujula-net
    ports:
      - "8090:8080"
      - "9000:9000"
    command: start-dev --import-realm --health-enabled=true
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev}
      KC_DB: ${KC_DB:-postgres}
      KC_DB_URL: ${KC_DB_URL:-jdbc:postgresql://postgres:5432/keycloak_db}
      KC_DB_USERNAME: ${KC_DB_USERNAME:-brujula}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-brujula_dev}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      # T-WU7 fix: set the canonical public hostname URL so tokens are issued with
      # iss=http://localhost:8090/realms/brujula-dev. Without this, the issuer in
      # tokens depends on the Host header of the request — when the backend calls
      # keycloak:8080/userinfo, Keycloak sees Host:keycloak:8080 and rejects the
      # token (iss mismatch). Pinning to http://localhost:8090 (the host-mapped port)
      # makes all tokens consistent regardless of how Keycloak is reached.
      # Keycloak 26 KC_HOSTNAME accepts either a plain hostname OR a full URL.
      KC_HOSTNAME: ${KC_HOSTNAME:-http://localhost:8090}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Keycloak 26 image has no curl/wget; use bash /dev/tcp to probe the management port.
      # bash -c '(echo -e "GET /health/ready HTTP/1.0\r\n\r\n" | timeout 5 bash -c "cat > /dev/tcp/localhost/9000") 2>/dev/null' exits 0 on connection
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\":' <&3"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  # ------------------------------------------------------------
  # Mailpit v1.27 — local SMTP + web UI for email testing
  # SMTP: localhost:1025 | Web UI: http://localhost:8025
  # ------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:v1.27.3
    container_name: brujula-mailpit
    restart: unless-stopped
    networks:
      - brujula-net
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: "500"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8025 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
