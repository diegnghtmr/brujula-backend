# ============================================================
# Brújula — Full Stack Compose (DC-001, TRD §16)
# "Completo" mode: includes backend and frontend on top of deps.
# Includes compose.yaml for the infrastructure dependencies.
#
# Usage:
#   docker compose -f ops/local/compose.full.yaml up -d
#   docker compose -f ops/local/compose.full.yaml down -v
# ============================================================

include:
  - compose.yaml

name: brujula-local-full

services:

  # ------------------------------------------------------------
  # Spring Boot 4 / Java 25 backend
  # Image: eclipse-temurin:25-jdk base (build from source)
  # ------------------------------------------------------------
  backend:
    build:
      context: ../../
      dockerfile: ops/local/Dockerfile.backend
    container_name: brujula-backend
    restart: unless-stopped
    networks:
      - brujula-net
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SPRING_DATASOURCE_URL: ${BRUJULA_DB_URL:-jdbc:postgresql://postgres:5432/planner_db}
      SPRING_DATASOURCE_USERNAME: ${BRUJULA_DB_USERNAME:-brujula}
      SPRING_DATASOURCE_PASSWORD: ${BRUJULA_DB_PASSWORD:-brujula_dev}
      SERVER_PORT: "8080"
      # T-WU7 compose fix: override Keycloak provider URIs to use the Docker-internal hostname
      # (application.yaml defaults to localhost:9090 for non-container dev; in compose the
      # Keycloak service is reachable at keycloak:8080 on the brujula-net network).
      # The authorization-uri is what the BACKEND sends as a redirect to the browser,
      # so it must use a host:port reachable FROM THE HOST (localhost:8090).
      # token-uri / jwk-set-uri / user-info-uri are backend-to-backend calls → keycloak:8080.
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_AUTHORIZATION_URI: ${KC_AUTH_URI:-http://localhost:8090/realms/brujula-dev/protocol/openid-connect/auth}
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_TOKEN_URI: ${KC_TOKEN_URI:-http://keycloak:8080/realms/brujula-dev/protocol/openid-connect/token}
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_JWK_SET_URI: ${KC_JWK_URI:-http://keycloak:8080/realms/brujula-dev/protocol/openid-connect/certs}
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_USER_INFO_URI: ${KC_USERINFO_URI:-http://keycloak:8080/realms/brujula-dev/protocol/openid-connect/userinfo}
      # Keycloak Admin REST API — used by the registration service for user provisioning
      BRUJULA_KEYCLOAK_AUTH_SERVER_URL: ${KC_ADMIN_URL:-http://keycloak:8080}
      # V020 renamed SPRING_SESSION → spring_session (lowercase); table-name default is correct.
      # Force the OAuth2 redirect-uri to use localhost (host-accessible port) rather than
      # the Docker-internal hostname (backend:8080 is not reachable from the host browser).
      # Spring Security resolves {baseUrl} from the incoming request Host header; when the
      # request comes through the frontend proxy (Host: backend:8080), it emits an
      # unreachable redirect_uri. Explicit override ensures the browser can reach the callback.
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://localhost:8080/login/oauth2/code/keycloak}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      # eclipse-temurin image has no curl/wget; bash IS available but CMD-SHELL uses /bin/sh.
      # Use CMD form to invoke bash directly with /dev/tcp.
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /actuator/health/readiness HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'UP' <&3"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  # ------------------------------------------------------------
  # React / Vite frontend (Node 24 build → static preview)
  # ------------------------------------------------------------
  frontend:
    build:
      context: ../../../brujula-frontend
      dockerfile: ../brujula-backend/ops/local/Dockerfile.frontend
    container_name: brujula-frontend
    restart: unless-stopped
    networks:
      - brujula-net
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://backend:8080}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Use 127.0.0.1 explicitly — BusyBox wget in Alpine node images may fail on
      # 'localhost' hostname resolution inside the container network namespace.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5173 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ------------------------------------------------------------
  # pgAdmin — optional, only in tools profile
  # docker compose --profile tools up
  # ------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:9.4
    container_name: brujula-pgadmin
    restart: unless-stopped
    networks:
      - brujula-net
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@brujula.local
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-pgadmin_dev}
    profiles:
      - tools
